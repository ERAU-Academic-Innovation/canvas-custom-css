name: Build generated files

on:
  push:
    branches: [main]
    paths:
      - "theme-*.css"
      - "custom-themes.manifest.css"
      - "build.py"
      - "scripts/generate_docs.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run build.py
        run: python3 build.py

      - name: Run scripts/generate_docs.py
        run: python3 scripts/generate_docs.py

      - name: Commit regenerated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom-themes.css docs/*.html docs/*.md
          git diff --quiet --cached || {
            git commit -m "Auto-rebuild generated files [skip ci]"
            git push
          }
