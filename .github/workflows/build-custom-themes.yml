name: Build custom-themes.css

on:
  push:
    branches: [main]
    paths:
      - "theme-erau-*.css"
      - "custom-themes.manifest.css"
      - "build.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run build.py
        run: python3 build.py

      - name: Commit regenerated custom-themes.css
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet custom-themes.css || {
            git add custom-themes.css
            git commit -m "Auto-rebuild custom-themes.css [skip ci]"
            git push
          }
